<!doctype html>
<!--
  Device HMI document shell. Static containers are populated by hmi.js from
  HTTP bootstrap data and the shared WebSocket stream; controls remain local to
  the browser until an explicitly supported backend action is invoked.
-->

<html>

<head>

  <meta charset="utf-8">

  <title>Dynamic HMI Console</title>

  <link rel="stylesheet" href="style.css?v=20261026-ui-2">
  <style>
  html,
  body.hmiPage {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body.hmiPage .layout {
    min-height: 100vh;
    height: auto;
    overflow: visible;
  }

  body.hmiPage .main.scadaMain {
    min-height: 100vh;
    height: auto;
    overflow: visible;
    display: grid;
    grid-template-rows: auto auto minmax(0, auto) minmax(190px, auto);
    gap: 10px;
    padding-bottom: 24px;
  }

  body.hmiPage .missionBanner {
    min-height: 28px;
  }

  body.hmiPage .hmiKpiBar {
    display: grid;
    grid-template-columns: repeat(4, minmax(130px, 1fr));
    gap: 10px;
  }

  body.hmiPage .commandCenterGrid {
    min-height: 0;
    overflow: visible;
    display: grid !important;
    grid-template-columns:
      minmax(210px, 0.72fr)
      minmax(0, 1.9fr)
      minmax(230px, 0.82fr) !important;
    grid-template-areas: "left center right";
    gap: 12px;
    align-items: start;
  }

  body.hmiPage .leftPanel {
    grid-area: left;
    min-height: 0;
    min-width: 0;
    overflow: visible;
  }

  body.hmiPage .centerPanel {
    grid-area: center;
    min-height: 0;
    min-width: 0;
    overflow: visible;
  }

  body.hmiPage .rightPanel {
    grid-area: right;
    min-height: 0;
    min-width: 0;
    overflow: visible;
  }

  body.hmiPage #hmiCanvas {
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    overflow-x: hidden;
    display: grid;
    grid-template-columns: 1fr;
    grid-auto-rows: minmax(58px, auto);
    gap: 8px;
    align-content: start;
  }

  body.hmiPage .devicePanel {
    min-height: 58px;
    padding: 8px 10px;
    overflow: hidden;
  }

  body.hmiPage .devicePanel .deviceHealthBar,
  body.hmiPage .devicePanel .deviceMiniStatus,
  body.hmiPage .devicePanel .deviceLiveSignals {
    display: none !important;
  }

  body.hmiPage .deviceTitle {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 8px;
  }

  body.hmiPage .deviceTitle h2 {
    font-size: 13px;
    margin: 0;
    white-space: nowrap;
  }

  body.hmiPage .deviceStats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    font-size: 11px;
    margin-top: 4px;
  }

  body.hmiPage .deviceLastSeen,
  body.hmiPage .deviceMulticast {
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  body.hmiPage .playbackPanel {
    display: grid;
    gap: 7px;
  }

  body.hmiPage #alarmCenter,
  body.hmiPage #telemetryFeed {
    max-height: 130px;
    overflow: hidden;
  }

  body.hmiPage #hmiDeviceInfo {
    min-height: 520px;
    height: auto;
    overflow: visible;
  }

  body.hmiPage .trendPanel {
    min-height: 0;
    overflow: visible;
  }

  body.hmiPage .trendPanel .chartContainer {
    min-height: 150px;
    overflow: visible;
  }

  body.hmiPage .inspectorGraphTile {
    position: relative;
  }

  body.hmiPage .graphLiveReadout {
    margin-top: 4px;
    font-size: 11px;
    color: #89f7ff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (max-width: 1200px) {
    body.hmiPage .commandCenterGrid {
      grid-template-columns:
        minmax(190px, 0.7fr)
        minmax(0, 1.7fr)
        minmax(210px, 0.8fr) !important;
    }
  }

  /*
  Final HMI page layout guard. Older global HMI blocks in style.css use
  broad !important rules, so the page needs its own scoped final word.
  */
  body.hmiPage .main.scadaMain {
    width: calc(100vw - var(--final-sidebar-width, 230px)) !important;
    max-width: calc(100vw - var(--final-sidebar-width, 230px)) !important;
    min-width: 0 !important;
    margin-left: var(--final-sidebar-width, 230px) !important;
    padding: 16px !important;
    overflow-x: hidden !important;
    overflow-y: visible !important;
    grid-template-rows: auto auto auto auto !important;
  }

  body.hmiPage .missionBanner,
  body.hmiPage .hmiKpiBar,
  body.hmiPage .commandCenterGrid,
  body.hmiPage .trendPanel {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
  }

  body.hmiPage .hmiKpiBar {
    grid-template-columns: repeat(4, minmax(140px, 1fr)) !important;
  }

  body.hmiPage .commandCenterGrid {
    display: grid !important;
    grid-template-columns:
      minmax(170px, 220px)
      minmax(360px, 1fr)
      minmax(200px, 260px) !important;
    grid-template-areas: "left center right" !important;
    gap: 16px !important;
    align-items: start !important;
  }

  body.hmiPage .leftPanel {
    grid-area: left !important;
  }

  body.hmiPage .centerPanel {
    grid-area: center !important;
  }

  body.hmiPage .rightPanel {
    grid-area: right !important;
    position: sticky !important;
    top: 16px !important;
    max-height: calc(100vh - 32px) !important;
    overflow: hidden !important;
  }

  body.hmiPage #hmiCanvas {
    display: grid !important;
    grid-template-columns: 1fr !important;
    max-height: calc(100vh - 92px) !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }

  body.hmiPage #hmiDeviceInfo,
  body.hmiPage .selectedDeviceDetail {
    max-height: none !important;
    overflow: visible !important;
  }

  body.hmiPage .trendPanel {
    min-height: 360px !important;
    margin-top: 16px !important;
  }

  body.hmiPage .trendPanel .chartContainer,
  body.hmiPage .trendPanel #trendChart {
    min-height: 320px !important;
    height: 320px !important;
  }

  @media (max-width: 1180px) {
    body.hmiPage .commandCenterGrid {
      grid-template-columns:
        minmax(150px, 190px)
        minmax(300px, 1fr)
        minmax(190px, 230px) !important;
      gap: 12px !important;
    }
  }

  @media (max-width: 980px) {
    body.hmiPage .main.scadaMain {
      width: 100vw !important;
      max-width: 100vw !important;
      margin-left: 0 !important;
    }

    body.hmiPage .hmiKpiBar,
    body.hmiPage .commandCenterGrid {
      grid-template-columns: minmax(0, 1fr) !important;
    }

    body.hmiPage .commandCenterGrid {
      grid-template-areas:
        "center"
        "right"
        "left" !important;
    }

    body.hmiPage .rightPanel {
      position: static !important;
      max-height: none !important;
      overflow: visible !important;
    }

    body.hmiPage #hmiCanvas {
      max-height: none !important;
    }
  }
</style>

</head>

<body class="hmiPage">
<div class="layout">

<aside class="sidebar">

  <h2>SCADA</h2>

  <a id="dashboardLink" href="critical-dashboard.html">
    Critical Dashboard
  </a>

  <a href="drive-control.html">
    Drive &amp; Buttons
  </a>

  <a href="dashboard.html">Main Dashboard</a>

  <a href="history.html">
    History
  </a>

  <a href="topology.html">
    Topology
  </a>

  <a href="hmi.html">
    HMI
  </a>

  <a href="diagnostic.html">
    Diagnostics
  </a>

</aside>

  <main class="main scadaMain">

    <div class="missionBanner">
      MISSION STATUS : OPERATIONAL | LIVE TELEMETRY STREAM ACTIVE
    </div>

    <div class="hmiHiddenControls" hidden>
      <select id="dbSelect"></select>
      <select id="hmiDeviceSelect"></select>
      <select id="hmiProcessSelect"></select>
      <div id="hmiStatus" class="hmiStatus">
        <div class="hmiPowerSummary">
          <span class="summaryOff">INITIALIZING</span>
        </div>
      </div>
    </div>

    <div class="hmiKpiBar">
      <div class="kpiCard">
        <span>Devices</span>
        <h2 id="totalDevices">0</h2>
      </div>

      <div class="kpiCard">
        <span>Online</span>
        <h2 id="onlineDevices">0</h2>
      </div>

      <div class="kpiCard">
        <span>Warnings</span>
        <h2 id="warningDevices">0</h2>
      </div>

      <div class="kpiCard">
        <span>Packets</span>
        <h2 id="packetCount">0</h2>
      </div>
    </div>

    <div class="commandCenterGrid">

      <section class="card leftPanel">
        <div class="hmiHeader">
          <h2>Mission Control</h2>
          <div class="liveDot"></div>
        </div>

        <div class="playbackPanel">
          <button id="liveBtn">LIVE</button>
          <button id="playBtn">Play</button>
          <button id="pauseBtn">Pause</button>
          <button id="rewindBtn">Rewind</button>
          <button id="forwardBtn">Forward</button>
          <button id="replayBtn">Replay</button>

          <input
            type="range"
            id="timelineSlider"
            min="0"
            max="0"
            value="0">

          <div id="playbackTime">--</div>
        </div>

        <div id="alarmCenter"></div>

        <div id="telemetryFeed"></div>
      </section>

      <section class="card centerPanel">
        <div class="hmiHeader">
          <h2>Device Inspector</h2>
          <div class="liveDot"></div>
        </div>

        <div id="hmiDeviceInfo"></div>
      </section>

      <section class="card rightPanel">
        <div class="hmiHeader">
          <h2>Device Fleet</h2>
          <div class="liveDot"></div>
        </div>

        <div id="hmiCanvas"></div>
      </section>

    </div>

    <section class="card trendPanel">
      <div class="hmiHeader">
        <h2>Mission Telemetry Analytics</h2>
        <div class="liveDot"></div>
      </div>

      <div class="chartContainer">
        <canvas id="trendChart"></canvas>
      </div>
    </section>

  </main>

</div>

<div id="deviceInspector"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="chart-fallback.js"></script>

<script src="common.js?v=20261028-scada-1"></script>

<script src="hmi.js?v=20260715-drive-history-carrier"></script>

</body>

</html>
