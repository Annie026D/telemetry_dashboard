# Runtime configuration loaded once during backend startup. Unknown keys are
# ignored for forward compatibility; malformed numeric values fall back to
# safe defaults in app.c.
[server]
# Choose the local TCP port on which operators and browser clients reach the telemetry API.
http_port=8090
# Point the HTTP server at the directory containing the dashboard interface files.
web_root=web

# Group SQLite storage policy used by the single telemetry writer.
[database]
# Under WSL, a relative directory launched from /mnt/c is automatically
# redirected to ~/.telemetry-dashboard/data. SQLite WAL files must live on the
# native Linux filesystem; keeping them on DrvFS/9p can corrupt the database
# and severely limit writer throughput.
dir=data
# Every packet is retained in telemetry.raw_json. Only these fields are also
# expanded into the indexed telemetry_rows table for history/graph queries.
# Use expand_all_fields=1 only for low-rate compatibility deployments.
expand_all_fields=1
# List the telemetry field names that receive flattened, indexed rows for efficient history queries.
indexed_fields=latitude,lat,longitude,lon,lng,altitude,alt,roll,pitch,yaw,pan,tilt,bearing,range,heading,speed,rpm,current,voltage,state,status,mode,health,alive,connected,tracking,anomaly,alarm,fault,error,temperature,pressure
# Start a new same-day shard at this approximate combined DB+WAL size. The
# completed shard is moved to data/Archive Data without stopping UDP reception.
rotate_mb=8192
# Commit packet batches at this size; increase only after measuring storage I/O.
writer_batch_packets=8192
# Commit a partial batch after this many milliseconds to bound live-query age.
writer_batch_ms=1000
# Request this UDP kernel receive buffer per channel to absorb short bursts.
udp_receive_buffer_mb=64

# Durable append-only recovery spool. On this deployment it defaults to the
# same physical volume and therefore does not protect against complete disk
# failure or exhaustion of that volume.
[spool]
dir=spool
max_gb=50

# Group the enablement and UDP network settings for udp channel 1.
[udp_channel_1]
# Enable this receiver so its configured telemetry stream is accepted.
enabled=1
# Assign the canonical channel name used for device identification and diagnostics.
name=lcu_transport
# Set the multicast group or unicast address from which this telemetry channel receives packets.
group_ip=239.255.0.1
# Set the UDP port that distinguishes this telemetry feed from the other configured channels.
port=50100
# Select the local network interface used to join or listen for this UDP feed.
iface_ip=0.0.0.0

